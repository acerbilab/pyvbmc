repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude_types: [json, binary]
        exclude: ^docs/
  - repo: https://github.com/PyCQA/isort
    rev: "5.12.0"
    hooks:
      - id: isort
        additional_dependencies: [toml]
        exclude: docs/tutorials
  - repo: https://github.com/psf/black
    rev: "23.3.0"
    hooks:
      - id: black-jupyter
        # Preserve the exact historical runners referenced by measurement hashes.
        exclude: ^(dev/scripts/calibrate_chunks\.py|dev/experiments/machine_calibration/initial_unbalanced_runner\.py)$
  - repo: https://github.com/hadialqattan/pycln
    rev: "v2.6.0"
    hooks:
      - id: pycln
