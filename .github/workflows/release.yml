name: publish-release

on:
  # `published` is sent whether a release is published at once or as a saved
  # draft; `created` is sent for a draft when it is saved, and Actions ignores
  # it then, so publishing that draft later would not start the upload.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: acerbilab/pyvbmc/.github/workflows/build.yml@main
  upload_to_pypi:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: artifact
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.pypi_password }}
