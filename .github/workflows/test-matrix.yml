# The test job, defined once. Called by tests.yml (manual dispatch, the
# twice-monthly schedule, pushes to dev* branches) and merge-tests.yml (PRs
# to main). Not triggered on its own.
name: test-matrix

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      python-version:
        description: JSON list of Python versions
        type: string
        default: '["3.10", "3.11", "3.12"]'
      gpyreg-ref:
        description: >-
          gpyreg git ref to test against. Empty means the pinned commit below
          (the gpyreg the suite is known to pass with); the scheduled run
          passes "main" to detect drift in gpyreg itself.
        type: string
        default: ''

env:
  # gpyreg v1.2.0: GP.predict(return_cross_covariance=True) for VIQR reuse.
  GPYREG_PIN: 39536b000a8c8465133f4eaef625486991db8257

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        python-version: ${{ fromJSON(inputs.python-version) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout PyVBMC
        uses: actions/checkout@v6
        with:
          path: pyvbmc

      - name: Checkout GPyReg
        uses: actions/checkout@v6
        with:
          repository: acerbilab/gpyreg
          ref: ${{ inputs.gpyreg-ref || env.GPYREG_PIN }}
          path: gpyreg
          # full history so setuptools_scm reads gpyreg's real version from
          # its tags (a shallow clone reports 0.1.dev1, below the minimum
          # pyproject.toml requires)
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Select optional torch coverage (posterior exports, S-VBMC)
        id: exports
        shell: python
        env:
          PYTHON_MATRIX: ${{ inputs.python-version }}
          CURRENT_PYTHON: ${{ matrix.python-version }}
          CURRENT_OS: ${{ matrix.os }}
        run: |
          import json
          import os
          versions = json.loads(os.environ["PYTHON_MATRIX"])
          newest = max(versions, key=lambda v: tuple(map(int, v.split("."))))
          enabled = (os.environ["CURRENT_OS"] == "ubuntu-latest"
                     and os.environ["CURRENT_PYTHON"] == newest)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"enabled={str(enabled).lower()}", file=output)

      - name: Install CPU torch
        if: steps.exports.outputs.enabled == 'true'
        run: python -m pip install "torch>=2.7" --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyVBMC
        run: |
          cd ./pyvbmc
          python -m pip install -e ".[test]"

      - name: Install optional torch features (posterior exports, S-VBMC)
        if: steps.exports.outputs.enabled == 'true'
        run: python -m pip install -e "./pyvbmc[test,torch,arviz]"

      - name: Install GPyReg
        run: |
          cd ./gpyreg
          git log --oneline -1
          python -m pip install -e ".[test]"

      - name: Run tests
        run: |
          cd ./pyvbmc
          python -m pytest --reruns=5 -x -vv
