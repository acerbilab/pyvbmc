# From github.com/dfm/tinygp; the job itself lives in test-matrix.yml.
name: tests

on:
  workflow_dispatch:
    inputs:
      gpyreg-ref:
        description: gpyreg ref to test against (empty = the pinned commit)
        type: string
        default: ''
  schedule:
    # Run on the 13th and 28th of each month, at 00:23 UTC (on main). This
    # run tests against gpyreg main instead of the pin: the drift detector
    # for a dependency installed from a moving branch.
    - cron:  '23 00 13,28 * *'
  # Development branches (those named dev*): a reduced
  # smoke run on every push that touches the package, so a long-lived branch
  # without a PR is not left to manual dispatch. PRs to main run the full
  # matrix through merge-tests.yml.
  push:
    branches:
      - 'dev*'
    paths:
      - 'pyvbmc/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/tests.yml'
      - '.github/workflows/test-matrix.yml'

# A newer push to the same branch supersedes a running smoke run; scheduled
# and dispatched runs are never cancelled.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  tests:
    uses: ./.github/workflows/test-matrix.yml
    with:
      # Full 3 OS x 5 Python matrix on schedule and dispatch; Ubuntu with
      # the newest Python only on branch pushes.
      os: ${{ github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]' }}
      python-version: ${{ github.event_name == 'push' && '["3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]' }}
      gpyreg-ref: ${{ github.event_name == 'schedule' && 'main' || inputs.gpyreg-ref || '' }}
