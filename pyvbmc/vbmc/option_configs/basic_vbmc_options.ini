[BasicOptions]
# Level of display ("off", "iter", or "full"); "off" prints warnings only
display = "iter"
# Whether to show occasional runtime tips, and the reminder that the installed release is more than a year old, at the start of new runs
show_tips = True
# Plot marginals of variational posterior at each iteration
plot = False
# Max number of iterations
max_iter = 50*(2+D)
# Maximum function-equivalent evaluation budget, including initialization_cost
max_fun_evals = 50*(2+D)
# Number of target evaluations per iteration
fun_evals_per_iter = 5
# Required stable target evaluations for termination
tol_stable_count = 60
# Number of variational components to refine posterior at termination
min_final_components = 50
# Whether the target log joint function returns a noise estimate (SD) as second output, True or False
specify_target_noise = False
# Target accepts batches with shape (N, D): the initial design is one batch and later calls contain one row; returns one value per row
vectorized_target = False
# Name of file to write logs to (if None, no log file will be written)
log_file_name = None
# Logging level for the log file, which is written whenever log_file_name is set: "off", "iter" or "full", or a level of the logging module, that is a non-negative integer (e.g. logging.DEBUG)
log_file_level = "iter"
# Logging write mode, one of ("w", "w+", or "a")
log_file_mode = "a"
# Whether to re-print column headers for optimization statistics at each iteration. If None, PyVBMC tries to guess based on plotting options.
print_iteration_header = None
