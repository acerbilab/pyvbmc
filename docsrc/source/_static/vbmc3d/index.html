<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyVBMC in Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=STIX+Two+Text:ital@1&display=swap">
<style>
  /* One deliberate look: a dark instrument. Every color is painted here. */
  :root {
    --ground: #04070c;
    --ink: #cfeaf5;
    --ink-dim: #5f8196;
    --ink-faint: #2c4556;
    --gp: #4fd8e8;
    --gp-hot: #ffb347;
    --vp: #ff4fa3;
    --acq: #e9ff5a;
    --truth: #b9c8d8;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: "STIX Two Text", "STIX Two Math", Georgia, "Times New Roman", serif;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; overflow: hidden; background: var(--ground); color: var(--ink);
    font-family: var(--mono); font-size: 13px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: relative; height: 100%; overflow: hidden; touch-action: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #gl:active { cursor: grabbing; }

  .hud { position: absolute; pointer-events: none; z-index: 2; }
  .hud button, .hud input { pointer-events: auto; }

  #head { top: clamp(14px, 3vh, 28px); left: clamp(16px, 3vw, 36px); right: clamp(16px, 3vw, 36px); max-width: 40ch; }
  #mark { font-weight: 500; letter-spacing: 0.32em; font-size: 12px; color: var(--ink); }
  #mark span { display: block; margin-top: 2px; }
  #mark span { color: var(--ink-dim); letter-spacing: 0.12em; font-weight: 400; }
  #tag { margin-top: clamp(10px, 2.2vh, 22px); font-size: 11px; letter-spacing: 0.2em; color: var(--gp); min-height: 1.4em; }
  #tag::before { content: "\25B8\00a0"; }
  #caption {
    margin: 6px 0 0; font-family: var(--serif); font-style: italic;
    font-size: clamp(16px, 1.1vw + 11px, 22px); line-height: 1.3; color: var(--ink);
    text-wrap: balance; text-shadow: 0 0 18px rgba(4, 7, 12, 0.9);
  }
  #caption .rest { opacity: 0; }
  #caption .done::after { content: ""; display: inline-block; width: 0.55em; height: 2px; margin-left: 3px; background: var(--gp); box-shadow: 0 0 8px var(--gp); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .axis { position: absolute; z-index: 1; pointer-events: none; font-family: var(--serif); font-style: italic; font-size: 15px;
    color: var(--ink-dim); transform: translate(-50%, -50%); text-shadow: 0 0 8px var(--ground); }
  .axis sub { font-size: 0.7em; font-style: normal; }

  #foot {
    left: clamp(16px, 3vw, 36px); right: clamp(16px, 3vw, 36px);
    bottom: calc(clamp(12px, 2.5vh, 24px) + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 12px;
  }
  #row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  #telemetry { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0; font-variant-numeric: tabular-nums; }
  #telemetry div { display: flex; flex-direction: column; }
  #telemetry dt { font-size: 10px; letter-spacing: 0.18em; color: var(--ink-dim); }
  #telemetry dd { margin: 0; font-size: clamp(15px, 0.6vw + 11px, 19px); font-weight: 500; color: var(--ink); white-space: nowrap; }
  #telemetry dd small { font-size: 0.72em; font-weight: 400; color: var(--ink-dim); }
  #telemetry .true dd { color: var(--truth); }
  #telemetry .elbo dd { color: var(--vp); }

  #chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 11px; letter-spacing: 0.08em; color: var(--ink-dim);
    background: rgba(8, 16, 24, 0.55); border: 1px solid var(--ink-faint);
    padding: 5px 9px; border-radius: 2px; cursor: pointer;
  }
  .chip::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border: 1px solid currentColor; vertical-align: 0; }
  .chip[aria-pressed="true"] { color: var(--c, var(--ink)); border-color: var(--c, var(--ink-dim)); }
  .chip[aria-pressed="true"]::before { background: currentColor; box-shadow: 0 0 8px currentColor; }

  #transport { display: flex; align-items: center; gap: 12px; }
  .ctl {
    font: inherit; font-size: 11px; letter-spacing: 0.1em; color: var(--ink);
    background: rgba(8, 16, 24, 0.55); border: 1px solid var(--ink-faint);
    min-width: 44px; height: 30px; padding: 0 10px; border-radius: 2px; cursor: pointer;
  }
  .ctl:hover, .chip:hover { border-color: var(--ink-dim); }
  .ctl:focus-visible, .chip:focus-visible, #seek:focus-visible { outline: 1px solid var(--gp); outline-offset: 2px; }
  #track { position: relative; flex: 1 1 0; min-width: 0; height: 30px; display: flex; align-items: center; }
  #ticks { position: absolute; left: 0; right: 0; top: 50%; height: 9px; transform: translateY(-50%); pointer-events: none; }
  #ticks i { position: absolute; top: 0; width: 1px; height: 100%; background: var(--ink-faint); }
  #ticks i.major { background: var(--ink-dim); }
  #seek { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; margin: 0; height: 30px; background: transparent; cursor: pointer; }
  #seek::-webkit-slider-runnable-track { height: 1px; background: var(--ink-dim); }
  #seek::-moz-range-track { height: 1px; background: var(--ink-dim); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 3px; height: 17px; margin-top: -8px; background: var(--gp); box-shadow: 0 0 10px var(--gp); border: 0; border-radius: 0; }
  #seek::-moz-range-thumb { width: 3px; height: 17px; background: var(--gp); box-shadow: 0 0 10px var(--gp); border: 0; border-radius: 0; }

  .corner { position: absolute; width: 14px; height: 14px; border: 0 solid var(--ink-faint); z-index: 1; pointer-events: none; }
  .corner.tl { top: 8px; left: 8px; border-top-width: 1px; border-left-width: 1px; }
  .corner.tr { top: 8px; right: 8px; border-top-width: 1px; border-right-width: 1px; }
  .corner.bl { bottom: 8px; left: 8px; border-bottom-width: 1px; border-left-width: 1px; }
  .corner.br { bottom: 8px; right: 8px; border-bottom-width: 1px; border-right-width: 1px; }

  #fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-dim); z-index: 3; }
  body.clean .hud, body.clean .corner, body.clean .axis { display: none; }
  body.clean #gl { cursor: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="Animated three-dimensional view of a PyVBMC run"></canvas>
  <span class="axis" id="ax1">x<sub>1</sub></span><span class="axis" id="ax2">x<sub>2</sub></span>
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

  <div id="head" class="hud">
    <div id="mark">PYVBMC <span>variational Bayesian Monte Carlo</span></div>
    <div id="tag"></div>
    <p id="caption"></p>
  </div>

  <div id="foot" class="hud">
    <div id="row">
      <dl id="telemetry">
        <div><dt>ITER</dt><dd id="tIter">00</dd></div>
        <div><dt>EVALS</dt><dd id="tEval">000</dd></div>
        <div><dt>K</dt><dd id="tK">&ndash;</dd></div>
        <div class="elbo"><dt>ELBO</dt><dd id="tElbo">&ndash;</dd></div>
        <div class="true" id="trueBox" hidden><dt>TRUE LOG Z</dt><dd id="tTrue">0.000</dd></div>
      </dl>
      <div id="chips" role="group" aria-label="Layers">
        <button class="chip" id="chipGp" style="--c: var(--gp)" aria-pressed="true">GP</button>
        <button class="chip" id="chipVp" style="--c: var(--vp)" aria-pressed="true">q(x)</button>
        <button class="chip" id="chipAcq" style="--c: var(--acq)" aria-pressed="true">ACQ</button>
        <button class="chip" id="chipTruth" style="--c: var(--truth)" aria-pressed="false">TRUTH</button>
        <button class="chip" id="chipDen" style="--c: var(--ink)" aria-pressed="false">DENSITY</button>
      </div>
    </div>
    <div id="transport">
      <button class="ctl" id="play" aria-label="Pause">II</button>
      <div id="track"><div id="ticks"></div><input id="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Timeline"></div>
      <button class="ctl" id="speed" aria-label="Playback speed">1&times;</button>
    </div>
  </div>
  <div id="fail" hidden>This animation needs WebGL 2, which this browser does not provide.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="trace.js"></script>
<script>
// A recorded PyVBMC run played back as a 3D wireframe. README.md next to this file explains the
// structure, the conventions and the display decisions; the trace format is defined by the docstrings
// of dev/scripts/export_animation_trace.py. In short: the timeline section turns the trace into lists
// of timed events, and update(tau, ...) draws the state at time tau from them and nothing else.
(async () => {
"use strict";
const TR = window.VBMC_TRACE;
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const qNum = (name, fallback) => { const v = parseFloat(Q.get(name)); return Number.isFinite(v) ? v : fallback; };
if (Q.get("hud") === "0") document.body.classList.add("clean");

// ---------------------------------------------------------------- renderer
const canvas = $("gl");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: "high-performance" });
} catch (e) { renderer = null; }
if (!renderer || !renderer.capabilities.isWebGL2 || !TR || typeof DecompressionStream === "undefined") {
  if (renderer && renderer.capabilities.isWebGL2) {
    $("fail").textContent = TR ? "This animation needs a browser that can inflate its data (DecompressionStream)."
                               : "The recorded run (trace.js) did not load.";
  }
  $("fail").hidden = false; return;
}
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setClearColor(0x04070c, 1);
renderer.autoClear = true;

// ---------------------------------------------------------------- trace
const META = TR.meta, ITS = TR.iterations, NIT = ITS.length, PTS = TR.points, N = META.n;
const XMID = (META.x_range[0] + META.x_range[1]) / 2, XH = (META.x_range[1] - META.x_range[0]) / 2;
const YMID = (META.y_range[0] + META.y_range[1]) / 2, YH = (META.y_range[1] - META.y_range[0]) / 2;
const toX = (x) => (x - XMID) / XH, toZ = (y) => -(y - YMID) / YH;
const LZ = Math.log1p(META.z_span);

// The grids come as one zlib block: every 16-bit grid (heights), then every 8-bit grid (SDs and
// acquisition values), each stored as its second difference along x and y. A grid is named by its index.
const N2 = N * N;
const packed = Uint8Array.from(atob(TR.grids), (c) => c.charCodeAt(0));
const block = await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
const wide = new Uint16Array(block, 0, META.grids.u16 * N2), narrow = new Uint8Array(block, 2 * META.grids.u16 * N2, META.grids.u8 * N2);
for (const a of [wide, narrow]) for (let o = 0; o < a.length; o += N2) {
  for (let j = 1; j < N; j++) for (let i = 0; i < N; i++) a[o + j * N + i] += a[o + (j - 1) * N + i];
  for (let j = 0; j < N; j++) for (let i = 1; i < N; i++) a[o + j * N + i] += a[o + j * N + i - 1];
}
function decodeZ(index) {
  const z = new Float32Array(N2);
  for (let i = 0; i < N2; i++) z[i] = META.z_top - Math.expm1((wide[index * N2 + i] / 65535) * LZ);
  return z;
}
function decodeSd(index) {
  const c = new Float32Array(N2);
  for (let i = 0; i < N2; i++) c[i] = narrow[index * N2 + i] / 255;
  return c;
}
function decodeAcq(index) {   // stored as 1 - sqrt(depth / span); the floor shader reads 1 - depth / span
  const a = new Float32Array(N2);
  for (let i = 0; i < N2; i++) { const r = 1 - narrow[index * N2 + i] / 255; a[i] = 1 - r * r; }
  return a;
}
function makeTex(r, g) {
  const data = new Float32Array(N * N * 4);
  for (let i = 0; i < N * N; i++) { data[4 * i] = r[i]; data[4 * i + 1] = g ? g[i] : 0; }
  return dataTex(data);
}
function dataTex(data) {
  const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat, THREE.FloatType);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}
const arrMax = (a) => { let m = -Infinity; for (let i = 0; i < a.length; i++) if (a[i] > m) m = a[i]; return m; };

const truthZ = decodeZ(TR.truth);
const ZREF = arrMax(truthZ), S_SCALE = 6.0, LIFT = 0.16, HGT = 0.95;
const truthTex = makeTex(truthZ);

// ---------------------------------------------------------------- anchored GP grids
// An observation anchors the surrogate: there the mean is the observed value and the predictive SD
// is zero. A 64 x 64 grid cannot show that, because an observation falls between its wires and the
// SD recovers within a fraction of a cell. So each observation owns the nearest free wire crossing,
// and every GP state is stored as a warped grid (texture channels: mean, SD, x and y displacement
// in cells): a smooth local displacement carries each owned crossing onto its observation, the mean
// there is corrected to the observed value, and the SD is capped by what conditioning on that one
// observation alone leaves, sf sqrt(1 - exp(-rho2)): zero at the observation, and for one hyperparameter
// sample an upper bound on the SD (more observations only lower it). Both corrections are sums of narrow bumps whose weights solve the small
// linear system that makes them exact at every anchor of the state.
const small = Math.min(window.innerWidth, window.innerHeight) < 560;
const STRIDE = 1;                        // every grid line is a wire, so every grid node is a crossing that can anchor
const BUMP = 0.75 * STRIDE, BUMP2 = 2 * BUMP * BUMP, REACH = Math.ceil(3 * BUMP);
const bump = (dx, dy) => Math.exp(-(dx * dx + dy * dy) / BUMP2);
const gridXY = PTS.map((q) => [((q[0] - META.x_range[0]) / (2 * XH)) * (N - 1), ((q[1] - META.y_range[0]) / (2 * YH)) * (N - 1)]);
const anchor = new Int32Array(PTS.length).fill(-1);
{
  const taken = new Set();
  PTS.forEach((q, i) => {
    const [gx, gy] = gridXY[i];
    if (gx < 0 || gy < 0 || gx > N - 1 || gy > N - 1) return;
    const ci0 = Math.round(gx / STRIDE) * STRIDE, cj0 = Math.round(gy / STRIDE) * STRIDE;
    let best = -1, bd = 1.6 * STRIDE;
    for (let dj = -2; dj <= 2; dj++) for (let di = -2; di <= 2; di++) {
      const ci = ci0 + di * STRIDE, cj = cj0 + dj * STRIDE;
      if (ci < 0 || cj < 0 || ci >= N || cj >= N || taken.has(cj * N + ci)) continue;
      const d = Math.hypot(ci - gx, cj - gy);
      if (d < bd) { bd = d; best = cj * N + ci; }
    }
    if (best >= 0) { anchor[i] = best; taken.add(best); }
    else console.warn(`vbmc3d: evaluation ${i} has no free wire crossing nearby and does not anchor the sheet`);
  });
}
const crom = (p0, p1, p2, p3, f) => p1 + 0.5 * f * (p2 - p0 + f * (2 * p0 - 5 * p1 + 4 * p2 - p3 + f * (3 * (p1 - p2) + p3 - p0)));
function sampleGrid(g, x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, cl = (v) => Math.min(Math.max(v, 0), N - 1);
  const row = (jj) => { const o = cl(jj) * N; return crom(g[o + cl(i - 1)], g[o + cl(i)], g[o + cl(i + 1)], g[o + cl(i + 2)], fx); };
  return crom(row(j - 1), row(j), row(j + 1), row(j + 2), fy);
}
// Weights w with sum_b w_b bump(anchor_a - anchor_b) = rhs_a for every anchor a, by Gauss-Seidel, which
// converges for a symmetric positive definite matrix. A Gaussian kernel matrix is one; cutting the bump
// off at REACH (where it is below 4e-4) keeps it so in practice: with every crossing of a 12 x 12 block
// an anchor, the smallest eigenvalue is 0.06 and the iteration contracts by 0.86 per sweep. The matrix is
// not diagonally dominant (off-diagonal row sums reach 2.5), so that is not the reason.
function bumpWeights(ai, aj, rhs) {
  const n = ai.length, nb = Array.from({ length: n }, () => []);
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
    const dx = ai[a] - ai[b], dy = aj[a] - aj[b];
    if (Math.abs(dx) <= REACH && Math.abs(dy) <= REACH) { const v = bump(dx, dy); nb[a].push([b, v]); nb[b].push([a, v]); }
  }
  return rhs.map((r) => {
    const w = Float64Array.from(r);
    for (let sweep = 0; sweep < 120; sweep++) for (let a = 0; a < n; a++) { let v = r[a]; for (const [b, k] of nb[a]) v -= k * w[b]; w[a] = v; }
    return w;
  });
}
function splat(field, offset, ai, aj, w) {
  for (let a = 0; a < ai.length; a++) for (let dj = -REACH; dj <= REACH; dj++) for (let di = -REACH; di <= REACH; di++) {
    const i = ai[a] + di, j = aj[a] + dj;
    if (i >= 0 && j >= 0 && i < N && j < N) field[4 * (j * N + i) + offset] += w[a] * bump(di, dj);
  }
}
function anchoredGrid(z, sdc, k, has) {
  const mem = []; for (let i = 0; i < PTS.length; i++) if (anchor[i] >= 0 && has(i)) mem.push(i);
  const ai = mem.map((i) => anchor[i] % N), aj = mem.map((i) => Math.floor(anchor[i] / N));
  const data = new Float32Array(N * N * 4);
  // displacement: every anchor lands on its observation
  const [wx, wy] = bumpWeights(ai, aj, [mem.map((i, a) => gridXY[i][0] - ai[a]), mem.map((i, a) => gridXY[i][1] - aj[a])]);
  // A weight beyond 1.5 cells would fold the mesh; limiting it leaves that crossing short of its observation.
  for (let a = 0; a < mem.length; a++) {
    const m = Math.hypot(wx[a], wy[a]), lim = 1.5 * STRIDE;
    if (m > lim) { wx[a] *= lim / m; wy[a] *= lim / m; console.warn(`vbmc3d: displacement of evaluation ${mem[a]} limited; its crossing is off the observation`); }
  }
  splat(data, 2, ai, aj, wx); splat(data, 3, ai, aj, wy);
  // mean and SD where the wires now are
  const sd = new Float32Array(N * N), half = META.sd_half;
  for (let j = 0, n = 0; j < N; j++) for (let i = 0; i < N; i++, n++) {
    const ux = data[4 * n + 2], uy = data[4 * n + 3], moved = ux !== 0 || uy !== 0;
    data[4 * n] = moved ? sampleGrid(z, i + ux, j + uy) : z[n];
    const c = Math.min(Math.max(moved ? sampleGrid(sdc, i + ux, j + uy) : sdc[n], 0), 0.996);   // the shader's ceiling
    sd[n] = (half * c) / (1 - c);
  }
  // SD capped by the nearest observations; mean corrected to pass through them
  const cellX = (2 * XH) / (N - 1), cellY = (2 * YH) / (N - 1), R = 5 * STRIDE;
  for (let a = 0; a < mem.length; a++) for (let dj = -R; dj <= R; dj++) for (let di = -R; di <= R; di++) {
    const i = ai[a] + di, j = aj[a] + dj; if (i < 0 || j < 0 || i >= N || j >= N) continue;
    const n = j * N + i, dx = (i + data[4 * n + 2] - gridXY[mem[a]][0]) * cellX, dy = (j + data[4 * n + 3] - gridXY[mem[a]][1]) * cellY;
    const cap = k[0] * Math.sqrt(Math.max(1 - Math.exp(-(k[1] * dx * dx + 2 * k[2] * dx * dy + k[3] * dy * dy)), 0));
    if (cap < sd[n]) sd[n] = cap;
  }
  const fix = mem.map((i, a) => PTS[i][2] - data[4 * (aj[a] * N + ai[a])]);   // observed value minus the grid's mean there
  const [wz] = bumpWeights(ai, aj, [fix]);
  splat(data, 0, ai, aj, wz);
  for (let n = 0; n < N * N; n++) data[4 * n + 1] = sd[n] / (sd[n] + half);
  const tex = dataTex(data); tex.userData = { mem, fix };
  return tex;
}
// A GP state's training set: the first `count` evaluations, less the ones that the iteration's
// record lists as trimmed (warm-up trimming happens before the iteration acquires its points).
const gpTex = [];
function addGp(zb, sb, k, count, prevN, active) {
  const has = (i) => i < count && (i >= prevN || active.has(i));
  gpTex.push(anchoredGrid(decodeZ(zb), decodeSd(sb), k, has));
  return gpTex.length - 1;
}
// A posterior is a Gaussian mixture in these coordinates (the problem is unbounded), so its grid is
// computed here from its components: log q(x) + ELBO, the posterior's estimate of the log joint.
const vpTex = [], vpMax = [], vpComp = [];
function addVp(vp, elbo) {
  const comps = vp.w.map((w, k) => {
    const c = vp.c[k], m = vp.M[k];
    return { x: c[0], y: c[1], w, sxx: m[0] * m[0] + m[1] * m[1], sxy: m[0] * m[2] + m[1] * m[3], syy: m[2] * m[2] + m[3] * m[3] };
  });
  const terms = comps.map((c) => { const det = c.sxx * c.syy - c.sxy * c.sxy; return { c, det, k: Math.log(c.w) - 0.5 * Math.log(det) - Math.log(2 * Math.PI) }; });
  const z = new Float32Array(N2), e = new Float64Array(terms.length);
  for (let j = 0, n = 0; j < N; j++) for (let i = 0; i < N; i++, n++) {
    const x = META.x_range[0] + (2 * XH * i) / (N - 1), y = META.y_range[0] + (2 * YH * j) / (N - 1);
    let top = -Infinity;
    terms.forEach((t, k) => {
      const dx = x - t.c.x, dy = y - t.c.y;
      e[k] = t.k - 0.5 * (t.c.syy * dx * dx - 2 * t.c.sxy * dx * dy + t.c.sxx * dy * dy) / t.det;

    stemCol.set([0.31 * s * 0.4, 0.85 * s * 0.4, 0.91 * s * 0.4, 0.31 * s, 0.85 * s, 0.91 * s], 6 * i);
  }
  nodeGeo.attributes.position.needsUpdate = nodeGeo.attributes.aSize.needsUpdate = nodeGeo.attributes.aCol.needsUpdate = true;
  stemGeo.attributes.position.needsUpdate = stemGeo.attributes.color.needsUpdate = true;
  rings.sort((a, b) => a[2] - b[2]);
  floorU.rings.value.forEach((r, i) => { if (i < rings.length && fade === 1) r.set(rings[i][0], rings[i][1], rings[i][2]); else r.z = -1; });

  // Camera
  const target = CAM_BY_TYPE[sg.type] || [0.5, 3.3];
  const kc = 1 - Math.exp(-dt * 0.9);
  cam.elT += (target[0] - cam.elT) * kc; cam.rT += (target[1] - cam.rT) * kc;
  cam.idle += dt;
  if (!cam.held && !reduced) cam.az += dt * 0.13 * Math.min(cam.idle / 2.5, 1);
  cam.el = Math.min(Math.max(cam.elT + cam.userEl + 0.035 * Math.sin(clock * 0.21), 0.08), 1.45);
  cam.r = cam.rT * cam.zoom * cam.fit;
  camera.position.set(cam.r * Math.cos(cam.el) * Math.sin(cam.az), 0.42 + cam.r * Math.sin(cam.el), cam.r * Math.cos(cam.el) * Math.cos(cam.az));
  camera.lookAt(0, 0.42, 0);

  camera.updateMatrixWorld();
  placeLabel(ax1, 0, 1.13); placeLabel(ax2, 1.13, 0);
  finalPass.u.time.value = clock;
  updateHud(sg, ts, landed, clock);
}

// ---------------------------------------------------------------- loop
resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing && !scrubbing) { tau += dt * speed; if (tau >= END) tau -= END; }
  if (!scrubbing) seek.value = tau.toFixed(2);
  update(tau, dt, now / 1000);
  renderFrame();
  requestAnimationFrame(frame);
}
// With ?capture=1 nothing moves by itself: a driver calls vbmcCapture.frame(t, dt) for successive t.
// No frame reads the wall clock, but the camera, the morph and truth levels and the caption typing carry
// over from frame to frame, so a sequence is reproducible when stepped in order from the start with the
// same dt, not when it seeks.
if (Q.get("capture") === "1") {
  cam.idle = 10;
  window.vbmcCapture = { end: END, frame(t, dt) { tau = t % END; update(tau, dt, t); renderFrame(); } };
  window.vbmcCapture.frame(tau, 0);
} else requestAnimationFrame(frame);
})();
</script>
